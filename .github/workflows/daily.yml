name: Karyawan AI Harian

on:
  schedule:
    # Jam 09:00 UTC = 16:00 WIB setiap hari
    - cron: '0 9 * * *'
  workflow_dispatch: {}  # manual trigger untuk test

permissions:
  contents: write  # supaya bisa auto-commit memory.json & reports/

concurrency:
  group: ai-employee-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI Employee
        env:
          # Provider LLM — cukup set salah satu. Gemini recommended.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          # Tool opsional
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python karyawan_ai.py

      - name: Commit results
        run: |
          git config user.name "AI Employee"
          git config user.email "actions@github.com"
          [ -f memory.json ] && git add memory.json || true
          git add reports/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily digest $(date -u +%F)"
            git push
          fi
